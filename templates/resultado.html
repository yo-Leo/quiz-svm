<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Respostas Registradas</title>

    <style>

        body {

            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        .container {

            max-width: 700px;
            background: white;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .info {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th, td {
            text-align: left;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }

        th {
            width: 40px;
        }

        a {

            display: block;
            background: #2563eb;
            color: white;
            padding: 15px;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        Respostas registradas com sucesso!
    </h1>

    <p class="info">

        ID da tentativa: <strong>{{ usuario_id }}</strong><br>
        Data/hora: <strong>{{ data_hora }}</strong>

    </p>

    <table>

        <thead>
            <tr>
                <th>#</th>
                <th>Afirmação</th>
                <th>Resposta</th>
            </tr>
        </thead>

        <tbody>

            {% for afirmacao in afirmacoes %}

            <tr>
                <td>{{ afirmacao.id }}</td>
                <td>{{ afirmacao.texto }}</td>
                <td>{{ escala[respostas[afirmacao.id]] }}</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <a href="/">

        Voltar ao Menu

    </a>


</div>


</body>

</html>
